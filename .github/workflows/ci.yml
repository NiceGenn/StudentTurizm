name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Проверки и тесты
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install "Django>=5.1,<5.2" Pillow

      - name: Валидация справочника data/
        run: python tools/check_data.py

      - name: Системные проверки Django
        run: python sources/manage.py check

      - name: Модели и миграции совпадают
        run: python sources/manage.py makemigrations --check --dry-run

      - name: Тесты
        run: python sources/manage.py test catalog accounts

      - name: Загрузка демонстрационного наполнения
        run: |
          python sources/manage.py migrate
          python sources/manage.py seed_demo
